<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrando no Maná</title>
<style>
  :root {
    --fundo: #FBF8F2;
    --texto: #1F1B16;
    --texto-suave: #4A4237;
    --destaque: #1E4E6B;
    --linha: #E4DCCD;
    --caixa: #F2ECE0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #121417;
      --texto: #F1ECE3;
      --texto-suave: #CFC6B8;
      --destaque: #9CCBE6;
      --linha: #2C3036;
      --caixa: #1B1E22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 1.25rem; margin: 40px 0 8px; padding-top: 16px; border-top: 1px solid var(--linha); }
  p, li { color: var(--texto-suave); }
  strong { color: var(--texto); }
  a { color: var(--destaque); }
  ul { padding-left: 1.2em; }
  li { margin: 6px 0; }
  .data { margin: 0 0 24px; font-size: 0.95rem; }
  .caixa { background: var(--caixa); border-radius: 12px; padding: 16px 18px; margin: 20px 0; }
  .caixa p { margin: 0; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.95rem; }
  th, td { text-align: left; vertical-align: top; padding: 10px 8px; border-bottom: 1px solid var(--linha); }
  th { color: var(--texto); }
  td { color: var(--texto-suave); }
  @media (max-width: 520px) {
    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    tr { padding: 10px 0; border-bottom: 1px solid var(--linha); }
    td { border: 0; padding: 2px 0; }
    td:first-child { color: var(--texto); font-weight: 600; }
  }
</style>
<style>
  .botao { display: block; text-align: center; font-weight: 600; text-decoration: none; padding: 14px 16px; min-height: 48px; box-sizing: border-box; border-radius: 10px; background: var(--texto); color: var(--fundo); margin: 24px 0 8px; }
  .erro { color: #8A2E1E; }
  @media (prefers-color-scheme: dark) { .erro { color: #F2A58F; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
<!--
  Volta do login com Google (12/10/2026). O app abre o login no Chrome de
  verdade — dentro da janelinha do app, a verificação "Confirme que é você"
  do Google se perdia. No fim, o Supabase manda o Chrome para cá, e esta
  página devolve a pessoa ao app pelo endereço mana://auth/callback, levando
  o login junto (depois do #, que nunca sai do aparelho). Se o Chrome não
  abrir o app sozinho, o botão abre — um toque da pessoa ele sempre deixa.
-->
<div id="ok" hidden>
  <h1>Pronto, você entrou!</h1>
  <p>Estamos voltando para o Maná. Se ele não abrir sozinho, toque no botão.</p>
  <a id="voltar" class="botao" href="#">Voltar ao Maná</a>
</div>

<div id="falhou" hidden>
  <h1>Não foi possível entrar</h1>
  <p class="erro" id="motivo"></p>
  <p>Volte ao Maná e tente de novo, ou entre com seu e-mail e senha.</p>
  <a id="voltar2" class="botao" href="mana://auth/callback">Voltar ao Maná</a>
</div>

<div id="vazio" hidden>
  <h1>Maná</h1>
  <p>Esta página só serve para concluir o login com o Google. <a href="./">Ir para o início</a>.</p>
</div>
</main>
<script>
(function () {
  var hash = location.hash.slice(1);
  var busca = location.search.slice(1);
  var p = new URLSearchParams(hash || busca);
  var volta = 'mana://auth/callback#' + (hash || busca);
  if (p.get('access_token') && p.get('refresh_token')) {
    document.getElementById('ok').hidden = false;
    document.getElementById('voltar').href = volta;
    setTimeout(function () { location.href = volta; }, 150);
  } else if (p.get('error') || p.get('error_description')) {
    document.getElementById('falhou').hidden = false;
    document.getElementById('motivo').textContent = p.get('error_description') || p.get('error');
    document.getElementById('voltar2').href = volta;
  } else {
    document.getElementById('vazio').hidden = false;
  }
})();
</script>
</body>
</html>
